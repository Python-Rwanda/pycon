travel:
  intro: |
    Rwanda's capital: safe, clean, easy to get around.
  # TODO: check against official sources before launch.
  sections:
    - title: Visas
      body: |
        Many visitors get a visa on arrival or need none.
        [Check your passport](https://www.migration.gov.rw). Need an invitation letter? Email us after registering.
    - title: Arriving
      body: |
        Fly into Kigali International Airport (KGL), a short drive from the city.
    - title: Getting around
      body: |
        Taxis, moto-taxis and ride-hailing apps. Directions to the venue closer to the date.
    - title: Money & data
      body: |
        Rwandan franc (RWF). Cards and mobile money are widely used. Cheap SIM cards at the airport.
  hotels: []

faq:
  - q: Who is it for?
    a: Anyone interested in Python, beginner or expert.
  - q: When and where?
    a: Kigali, 2027. Dates and venue are announced here first.
  - q: What language?
    a: English.
  - q: How do I give a talk?
    a: Submit to the [call for proposals](cfp). First-time speakers welcome.
  - q: Can I get help with costs?
    a: Yes, see [financial aid](financial-aid).
  - q: Will talks be recorded?
    a: We plan to publish recordings after the conference.
