about: |
  A community-run conference for everyone who uses Python, from students to maintainers.
  Organized by volunteers from [Python Rwanda](https://pythonrwanda.org).

formats:
  - { name: Talks, text: What people build with Python. }
  - { name: Workshops, text: Bring a laptop, leave with something built. }
  - { name: Keynotes, text: Voices from Rwanda, Africa and beyond. }
  - { name: Lightning talks, text: Five minutes, any topic. }
  - { name: Sprints, text: Contribute to open source. }
  - { name: Hallway track, text: Meet people, find collaborators. }

