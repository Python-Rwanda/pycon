cfp:
  url:
  opens:
  closes:
  intro: |
    First talk or fiftieth, we want to hear what you've built, learned or researched with Python.
  formats:
    - { name: Talk, length: 30 min, text: Includes questions. }
    - { name: Workshop, length: 2 hours, text: Attendees code along. }
    - { name: Lightning talk, length: 5 min, text: Sign up on the day. }
  # name: the topic. text: one line of examples. code: optional, shown above in code style.
  topics:
    - { name: Web & APIs, code: import django, text: "Django, Flask, FastAPI, building and scaling web apps." }
    - { name: Data science, code: import pandas, text: "Analysis, visualization, dashboards, working with messy data." }
    - { name: Machine learning & AI, code: import torch, text: "Models in production, LLMs, ML on local data and languages." }
    - { name: Python for impact, code: import geopandas, text: "Python in health, agriculture, finance and government." }
    - { name: Research & science, code: import numpy, text: "Scientific computing, reproducible research, notebooks." }
    - { name: Education, code: import turtle, text: "Teaching Python in schools, universities and bootcamps." }
    - { name: Tooling & quality, code: import pytest, text: "Testing, packaging, typing, performance, developer tools." }
    - { name: Community & open source, code: import this, text: "Contributing, maintaining, growing communities in Africa." }
